# Apenas desenvolvimento local. Produção usa um projeto Supabase próprio.
project_id = "lifeos"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
[db.pooler]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = false
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]
enable_signup = true
minimum_password_length = 12
[auth.email]
enabled = true
enable_confirmations = false
secure_password_change = true
[edge_runtime]
enabled = false
[analytics]
enabled = false
